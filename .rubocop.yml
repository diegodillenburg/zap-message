AllCops:
  Exclude:
    - 'db/schema.rb'
    - 'config/**/*'
Layout/EmptyLinesAroundClassBody:
  Enabled: False
Layout/EmptyLineAfterMagicComment:
  Enabled: False
Style/EmptyMethod:
  Enabled: False
Style/Documentation:
  Enabled: False
Style/FrozenStringLiteralComment:
  Enabled: False
Style/HashSyntax:
  Enabled: True
  EnforcedShorthandSyntax: never
Naming/VariableNumber:
  Enabled: True
  EnforcedStyle: snake_case
Metrics/BlockLength:
  # RSpec `describe`/`context`/`let` blocks are structurally long by design;
  # the cop only produces false positives against them.
  Exclude:
    - 'spec/**/*'
